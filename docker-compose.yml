services:
  db:
    image: postgres:16-alpine
    container_name: lumora-db
    environment:
      POSTGRES_DB: study_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_center"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumora-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/study_center?sslmode=disable
      ACCESS_TOKEN_SECRET: dev_access_secret_change_me
      REFRESH_TOKEN_SECRET: dev_refresh_secret_change_me
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ABSTRACT_API_KEY: ${ABSTRACT_API_KEY:-}
    ports:
      - "5173:5173"
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run db:push && npm run dev"

volumes:
  postgres_data:
